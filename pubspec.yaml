name: my_photo_organizer
description: "My Photo Organizer - capture, organize, and auto-sort your photos into folders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (firebase_core is the base SDK required before any other Firebase package)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3        # user records, referrals, admin dashboard data
  google_sign_in: ^6.2.1

  # Camera & Photos
  camera: ^0.11.0+2
  saver_gallery: ^5.0.0          # save photos to public gallery in named albums (replaces gal, which has a broken/unmaintained Android build.gradle)
  photo_manager: ^3.6.1          # read/query existing device photos for auto-organize
  permission_handler: ^11.3.1

  # Local storage (folders, subscription tier, metadata)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Image processing (for duplicate/similarity detection)
  image: ^4.2.0
  crypto: ^3.0.5

  # Face detection (for the People/face-grouping feature)
  google_mlkit_face_detection: ^0.13.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # In-app purchase (Pro subscription)
  in_app_purchase: ^3.2.0
  http: ^1.2.2                   # currency conversion rate lookup for the price display

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
